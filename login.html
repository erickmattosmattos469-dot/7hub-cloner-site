<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7HUB GEN - Login</title>
    <link href="css/login.css" rel="stylesheet">
    <style>
        #dotsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="dotsCanvas"></canvas>
    <div class="background"></div>
    
    <div class="container">
        <div class="login-box">
            <!-- Status Online -->
            <div class="status-online">
                <span class="dot"></span>
                ONLINE
            </div>

            <!-- Logo e Título -->
            <div class="header">
                <h1>7HUB GEN</h1>
                <p class="subtitle">Sistema de geração de links Spotify Premium</p>
            </div>

            <!-- Descrição -->
            <div class="description">
                <p>Gerador de links Spotify Premium com 1 e 3 meses. Controle de acesso, gerenciamento de links e estatísticas em tempo real.</p>
            </div>

            <!-- Abas de Acesso -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('admin')">ADMIN PANEL</button>
                <button class="tab-btn" onclick="switchTab('client')">KEY MANAGEMENT SYSTEM</button>
            </div>

            <!-- Formulário Admin -->
            <div id="admin-tab" class="tab-content active">
                <form onsubmit="loginAdmin(event)">
                    <div class="input-group">
                        <input type="password" id="admin-password" placeholder="senha de acesso" required>
                    </div>
                    <button type="submit" class="btn-enter">ENTRAR</button>
                </form>
                <p class="hint">Acesso: <strong>7deus</strong></p>
            </div>

            <!-- Formulário Cliente -->
            <div id="client-tab" class="tab-content">
                <form onsubmit="loginClient(event)">
                    <div class="input-group">
                        <input type="password" id="client-password" placeholder="chave de acesso" required>
                    </div>
                    <button type="submit" class="btn-enter">ENTRAR</button>
                </form>
                <p class="hint">Chave: <strong>clientefov</strong></p>
            </div>

            <!-- Mensagem de Erro -->
            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <script>
        // Senhas corretas
        const ADMIN_PASSWORD = '7deus';
        const CLIENT_KEY = 'clientefov';

        // Alternar abas
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
            document.getElementById('error-message').textContent = '';
        }

        // Login Admin
        function loginAdmin(event) {
            event.preventDefault();
            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('7hubgen_access', 'admin');
                localStorage.setItem('7hubgen_user', '7deus');
                window.location.href = 'index.html';
            } else {
                showError('Senha incorreta!');
                document.getElementById('admin-password').value = '';
            }
        }

        // Login Cliente
        function loginClient(event) {
            event.preventDefault();
            const key = document.getElementById('client-password').value;
            if (key === CLIENT_KEY) {
                localStorage.setItem('7hubgen_access', 'client');
                localStorage.setItem('7hubgen_user', 'clientefov');
                window.location.href = 'index.html';
            } else {
                showError('Chave incorreta!');
                document.getElementById('client-password').value = '';
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem('7hubgen_access')) {
                window.location.href = 'index.html';
            }
        });

        // Efeito de Bolinhas Roxas
        const canvas = document.getElementById('dotsCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(139, 92, 246, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        init();
        animate();
    </script>
</body>
</html>
